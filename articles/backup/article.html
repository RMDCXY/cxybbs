    <!-- 正文由 JS 动态填充 -->
    <h1 class="gradient-heading" id="article-title">加载中...</h1>
    <h4><span class="nolg">🕓</span>撰写于 <span id="article-date">--</span></h4>

    <script src="/a.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="article-data.js"></script>
    <script src="md.js"></script>
    <script>
        (function() {
        const path = window.location.pathname;
        let id = null;
        const match = path.match(/\/articles\/(\d+)/);
        if (match) id = match[1];
        if (!id) {
            const params = new URLSearchParams(window.location.search);
            id = params.get('id');
        }

        const titleEl = document.getElementById('article-title');
        const dateEl = document.getElementById('article-date');
        const markdownEl = document.getElementById('article-markdown');

        const db = window.ARTICLE_DB || {};
        const article = db[id];

        if (!article) {
            window.location.replace('/404.html');
            return;
        }

        document.title = article.title + ' - CXYの专栏';
        if (titleEl) titleEl.textContent = article.title;
        if (dateEl) dateEl.textContent = article.date;

        if (markdownEl) {
            // 判断是否启用 Markdown 渲染
            if (article.renderMarkdown && window.marked && typeof window.marked.parse === 'function') {
                const result = window.marked.parse(article.markdown || '');
                if (result && typeof result.then === 'function') {
                    result.then(function(html) {
                        markdownEl.innerHTML = html;
                        markdownEl.classList.add('markdown-body');
                        if (typeof window.addCodeCopyButtons === 'function') {
                            window.addCodeCopyButtons(markdownEl);
                        }
                    });
                } else {
                    markdownEl.innerHTML = result;
                    markdownEl.classList.add('markdown-body');
                    if (typeof window.addCodeCopyButtons === 'function') {
                        window.addCodeCopyButtons(markdownEl);
                    }
                }
            } else {
                markdownEl.textContent = article.markdown || '';
                markdownEl.classList.remove('markdown-body');
                markdownEl.style.whiteSpace = 'pre-wrap';
                markdownEl.style.backgroundColor = 'transparent';
                markdownEl.style.color = 'white';
                markdownEl.style.fontFamily = 'inherit';
                markdownEl.style.fontSize = 'inherit';
                markdownEl.style.lineHeight = '1.8';
                markdownEl.style.padding = '0';
                markdownEl.style.margin = '15px';
            }
        }
    })();
    </script>
</body>

</html>
